{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | OKZim Asset Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'styles/css/global_styles.css' %}">
    <link rel="stylesheet" href="{% static 'styles/css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'styles/css/asset_transfer.css' %}">
    <link rel="stylesheet" href="{% static 'styles/css/asset_management.css' %}">
    <link rel="stylesheet" href="{% static 'styles/css/notifications.css' %}">
    <link rel="stylesheet" href="{% static 'styles/css/reports.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="dashboard-container">
        {% include 'partials/sidebar.html' %}

        <div class="main-content">
            {% include 'partials/header.html' %}
            <main>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>

</html>
