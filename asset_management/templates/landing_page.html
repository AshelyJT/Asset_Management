{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKZim Asset Movement</title>
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <link rel="stylesheet" href="{% static 'styles/css/login.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="{% static 'images/okzim.png' %}" alt="Logo" class="logo" >
            </div>
            <div class="auth-header">
                <h2>ICT Asset Movement</h2>
            </div>
            <div class="auth-content">
                <p class="auth-subtitle">Manage your ICT assets with ease.</p>
                <form action="{% url 'login' %}">
                    <button class="auth-btn">Login</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
