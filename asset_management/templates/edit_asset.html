{% extends 'base.html' %}

{% load static %}

{% block title %}Asset Management{% endblock %}

{% block content %}
<h2>Edit Asset: {{ asset.name }}</h2>

<form method="POST">
    {% csrf_token %} <!-- ✅ Protects against security threats -->

    {{ form.as_p }} <!-- ✅ Renders form fields with paragraph styling -->

    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>

<a href="{% url 'asset_detail' asset.asset_tag %}" class="btn btn-secondary">Cancel</a>
{% endblock %}
